  kotlin-gdk-smoke-test:
    name: Test Kotlin GDK package
    needs: changes
    if: needs.changes.outputs.code == 'true' || 'push' != 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/maven-sdk.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      publish: false
      smoke-test: true

