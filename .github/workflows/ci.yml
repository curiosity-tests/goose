  rust-build-and-test:
    name: Build and Test Rust Project
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || 'push' != 'pull_request'
    steps:
    - name: Checkout Code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659   # v1.17.0

    - name: Repair stale v8 prebuilt marker
      run: .github/scripts/repair-v8-prebuilt.sh

    - name: Install Dependencies
      run: |
        sudo apt update -y
        sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev

    - name: Build and Test
      run: |
        gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
        export CARGO_INCREMENTAL=0
        cargo test --locked -- --skip scenario_tests::scenarios::tests
        cargo test --locked --jobs 1 scenario_tests::scenarios::tests
