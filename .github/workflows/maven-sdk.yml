            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  smoke-test-linux-aarch64:
    name: Smoke test Kotlin GDK (linux-aarch64)
    needs: package
    if: inputs.smoke-test
    runs-on: ubuntu-22.04-arm
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Set up Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb   # v6.3.0

    - name: Download Maven artifact bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
      with:
        name: goose-sdk-maven
        path: maven-artifacts

    - name: Install Maven artifact bundle into local repository
      shell: bash
      run: |
        version=$(grep -m1 '^version =' crates/goose-sdk/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
        target="$HOME/.m2/repository/io/github/aaif-goose/gdk/$version"
        mkdir -p "$target"
        find maven-artifacts -type f -exec cp -t "$target" {} +

    - name: Load native library in an ARM64 JVM
      shell: bash
      working-directory: crates/goose-sdk/examples/uniffi/kotlin
      run: |
        gradle --no-daemon installDist
        cat > "$RUNNER_TEMP/LoadNativeLibrary.java" <<'JAVA'
        public class LoadNativeLibrary {
            public static void main(String[] args) {
                System.out.println(io.github.aaif_goose.GooseKt.openaiDefaultModel());
            }
        }
        JAVA
        java -cp "$(find build/install -name '*.jar' | paste -sd: -)" "$RUNNER_TEMP/LoadNativeLibrary.java"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
